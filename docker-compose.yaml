services:
  web:
    build: ./backend
    container_name: api_postermaker
    command: >
      sh -c "python3 manage.py migrate &&
             python3 manage.py collectstatic --noinput &&
             gunicorn postermaker.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "change_me"

