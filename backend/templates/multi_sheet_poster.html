<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: letter;
            orientation: auto;
        }
        
        body {
            margin: 0;
            padding: 0;
        }
        
        .page {
            width: 100%;
            height: 100%;
            page-break-after: always;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .page:last-child {
            page-break-after: avoid;
        }
        
        img {
            width: 99%;
            height: 99%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    {% for img_data in image_sections %}
    <div class="page">
        <img src="data:image/png;base64,{{ img_data }}" />
    </div>
    {% endfor %}
</body>
</html>
